<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ปริมาณน้ำอ่างเก็บน้ำ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #1b1b3a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    canvas {
      background-color: #1b1b3a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</h2>
  <p>ประจำวันที่ 23/04/2568 (ล้าน ลบ.ม.)</p>
  <canvas id="waterChart" width="800" height="400"></canvas>

  <script>
    let url = 'https://api.sheety.co/2c432d6e3d2d1ef7fe0a3319849cd30e/ฺbigReservoirData/126Fbc2B170E9B3Fdc1Afe167B651168F6D9D68FEsged7Da';

    fetch(url)
      .then((response) => response.json())
      .then(json => {
        const data = json["126Fbc2B170E9B3Fdc1Afe167B651168F6D9D68FEsged7Da"];
        console.log(data);

        const labels = data.map(row => row["category"]);
        const storedWater = data.map(row => +row["น้ำเก็บกัก"]);
        const capacity = data.map(row => +row["ความจุอ่าง"]);
        const usableWater = data.map(row => +row["น้ำใช้การ"]);
        const remainingStoredWater = storedWater.map((value, index) => value - usableWater[index]);
        const extraCapacity = capacity.map((cap, index) => cap - storedWater[index]);


        const ctx = document.getElementById('waterChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'น้ำใช้การ',
                data: usableWater,
                backgroundColor: '#0057ff',
                stack: 'stored'
              },
              {
                label: 'น้ำเก็บกัก',
                data: remainingStoredWater,
                backgroundColor: '#5ba5f7',
                stack: 'stored',
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      const index = context.dataIndex;
                      const total = storedWater[index];
                      return 'น้ำเก็บกัก: ' + total.toLocaleString() + ' ล้าน ลบ.ม.';
                    }
                  }
                }
              },
              {
                label: 'น้ำรับได้อีก',
                data: extraCapacity,
                backgroundColor: '#c8e0f8',
                stack: 'stored'
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              x: {
                stacked: true,
                ticks: { color: 'white' },
                grid: { color: 'rgba(255,255,255,0.2)' }
              },
              y: {
                stacked: true,
                ticks: { color: 'white' },
                grid: { color: 'rgba(255,255,255,0.2)' }
              }
            },
            plugins: {
              legend: { labels: { color: 'white' } },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const index = context.dataIndex;
                    const datasetLabel = context.dataset.label;
                    if (datasetLabel === 'น้ำที่เก็บไว้แต่ยังไม่ใช้') {
                      const total = storedWater[index];
                      return 'น้ำเก็บกัก: ' + total.toLocaleString() + ' ล้าน ลบ.ม.';
                    } else {
                      return datasetLabel + ': ' + context.formattedValue + ' ล้าน ลบ.ม.';
                    }
                  }
                }
              }
            }
          }
        });
      });
  </script>
</body>
</html>
