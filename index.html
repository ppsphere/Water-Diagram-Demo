<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #1b1b3a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    canvas {
      background-color: #1b1b3a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</h2>
  <p>ประจำวันที่ 23/04/2568 (ล้าน ลบ.ม.)</p>
  <canvas id="waterChart" width="800" height="400"></canvas>

  <script>
    const ctx = document.getElementById('waterChart').getContext('2d');
    const waterChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['ภาคเหนือ', 'ภาคตะวันออกเฉียงเหนือ', 'ภาคกลาง', 'ภาคตะวันตก', 'ภาคตะวันออก', 'ภาคใต้'],
        datasets: [
          {
            label: 'น้ำใช้การ',
            data: [3000, 1000, 300, 2500, 400, 900],
            backgroundColor: '#0057ff'
          },
          {
            label: 'ปริมาณน้ำเก็บกัก',
            data: [10000, 3000, 600, 14000, 500, 2000],
            backgroundColor: '#5ba5f7'
          },
          {
            label: 'น้ำรับได้อีก',
            data: [8000, 3000, 400, 12000, 600, 1600],
            backgroundColor: '#c8e0f8'
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: 'white'
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            stacked: true,
            ticks: {
              color: 'white'
            },
            grid: {
              color: 'rgba(255,255,255,0.2)',
              borderColor: 'white',
              borderWidth: 1
            }
          },
          y: {
            stacked: true,
            ticks: {
              color: 'white'
            },
            grid: {
              color: 'rgba(255,255,255,0.2)',
              borderColor: 'white',
              borderWidth: 1
            }
          }
        }
      }
    });
  </script>
</body>
</html>
