<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #1b1b3a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    canvas {
      background-color: #1b1b3a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</h2>
  <p>ประจำวันที่ 23/04/2568 (ล้าน ลบ.ม.)</p>
  <canvas id="waterChart" width="800" height="400"></canvas>

  <script>
    const labels = ['ภาคเหนือ', 'ภาคตะวันออกเฉียงเหนือ', 'ภาคกลาง', 'ภาคตะวันตก', 'ภาคตะวันออก'];
    const usableWater = [7526.96, 1867.43, 346.11, 5185.13, 433.24];
    const storedWater = [14271.61, 3457.95, 406.11, 18462.13, 527.57];
    const additionalCapacity = [10553.61, 4910.52, 1012.89, 8142.87, 987.18];

    const ctx = document.getElementById('waterChart').getContext('2d');
    const waterChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'น้ำใช้การ',
            data: usableWater,
            backgroundColor: '#0057ff'
          },
          {
            label: 'ปริมาณน้ำเก็บกัก',
            data: storedWater,
            backgroundColor: '#5ba5f7'
          },
          {
            label: 'น้ำรับได้อีก',
            data: additionalCapacity,
            backgroundColor: '#c8e0f8'
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: 'white'
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            stacked: true,
            ticks: {
              color: 'white'
            },
            grid: {
              color: 'rgba(255,255,255,0.2)',
              borderColor: 'white',
              borderWidth: 1
            }
          },
          y: {
            stacked: true,
            ticks: {
              color: 'white'
            },
            grid: {
              color: 'rgba(255,255,255,0.2)',
              borderColor: 'white',
              borderWidth: 1
            }
          }
        }
      }
    });
  </script>
</body>
</html>
