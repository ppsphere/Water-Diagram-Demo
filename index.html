<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ปริมาณน้ำอ่างเก็บน้ำ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #1b1b3a;
      color: white;
      font-family: sans-serif;
      padding: 20px;
    }
    canvas {
      background-color: #1b1b3a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>ปริมาณน้ำอ่างเก็บน้ำขนาดใหญ่</h2>
  <p>โหลดข้อมูลจาก Google Sheets แบบเรียลไทม์</p>
  <canvas id="waterChart" width="800" height="400"></canvas>

  <script>
    let url = 'https://api.sheety.co/2c432d6e3d2d1ef7fe0a3319849cd30e/reservoirData23042568/reservoirData';

    fetch(url)
      .then((response) => response.json())
      .then(json => {
        const data = json.reservoirData;

        const labels = data.map(row => row["ภูมิภาคกลุ่มเขื่อน"]);
        const usableWater = data.map(row => +row["น้ำใช้การ"]);
        const storedWater = data.map(row => +row["ปริมาณน้ำเก็บกัก"]);
        const extraCapacity = data.map(row => +row["น้ำรับได้อีก"]);

        const ctx = document.getElementById('waterChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'น้ำใช้การ',
                data: usableWater,
                backgroundColor: '#0057ff'
              },
              {
                label: 'ปริมาณน้ำเก็บกัก',
                data: storedWater,
                backgroundColor: '#5ba5f7'
              },
              {
                label: 'น้ำรับได้อีก',
                data: extraCapacity,
                backgroundColor: '#c8e0f8'
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              x: {
                stacked: true,
                ticks: { color: 'white' },
                grid: { color: 'rgba(255,255,255,0.2)' }
              },
              y: {
                stacked: true,
                ticks: { color: 'white' },
                grid: { color: 'rgba(255,255,255,0.2)' }
              }
            },
            plugins: {
              legend: { labels: { color: 'white' } }
            }
          }
        });
      });
  </script>
</body>
</html>
